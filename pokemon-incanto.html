/* ===== Tema "stile Pokémon": colori Poké Ball, riquadri e pulsanti come nei giochi (approvato dall'utente) ===== */
:root,:root[data-theme="light"]{

  --bg:#F6F1E4; --surface:#FFFFFF; --ink:#1F2A44; --muted:#56627A; --line:#2B3A63;
  --p1:#E3350D; --p1-soft:#FDE3DC; --p2:#2A75BB; --p2-soft:#DDEBFA;
  --ok:#2E8B3E; --ok-soft:#E1F4E3; --warn:#9A5B00; --warn-soft:#FFF1CC; --err:#C21F1F; color-scheme:light;}}

  return data.map(p=>({name:p.name, display:p.display||p.name, dex:p.dex, type:p.types[0], type2:p.types[1]||null,
    color:p.color, form:p.form||null, legendary:!!p.legendary, mythical:!!p.mythical, tier:p.tier||'?', champions:!!p.champions}));

const SHINY_LOCK=['Spinda','Victini','Keldeo','Hoopa','Volcanion','Magearna','Marshadow','Zeraora','Urshifu','Zarude',

function isFull(s,p){ return s.teams[p].length>=TEAM_SIZE; }

// Copia dello stato senza la pila degli annullamenti e senza la funzione casuale

function raise(s,p,amount){
  const a=s.auction;

  if(!a||a.turn!==p) return 'turn';
  if(!Number.isInteger(amount)) return 'int';
  if(amount<=a.bid) return 'min|'+a.bid;
  if(amount>maxBid(s,p)) return 'max|'+maxBid(s,p);
  a.bid=amount; a.leader=p; a.turn=1-p; return null;
}

    if(k>=0){ idx[i]=k; S[i]=Object.assign({},all[i][k]); used.add(S[i].strumento); continue; }
    // strumento adatto al ruolo
    const dif=(s.mosse||[]).some(x=>RECOVERY.has(x))||hasStatus(s), lista=(dif?ITEM_DIF:ITEM_OFF).concat(ITEM_ALT);
    const it=lista.find(x=>!used.has(x)&&!(/^Choice/.test(x)&&hasStatus(s)));
    S[i]=Object.assign({},s,{strumento:it||'Leftovers',mega:null}); used.add(S[i].strumento); }
  return S.map((s,i)=>s?Object.assign(s,{_k:idx[i]}):s);
}
// Cosa può vedere "viewer" (0/1 online, 'local' sullo schermo condiviso) di un Pokémon posseduto da "owner"
// (null = all'asta). Se non può vederlo riceve solo l'indizio dell'asta al buio (tipo, numero o colore).
function hintOf(mon,mode){ return {hidden:true,name:'?',display:'?',dex:mode==='numero'?mon.dex:0,type:mode==='tipo'?mon.type:null,type2:null,color:mode==='colore'?mon.color:null,form:null}; }
function canSee(g,owner,viewer,localRevealed){
  if(owner==null) return g.mode==='classica';
  if(!g.hide||g.hide==='subito'||g.mode==='classica') return true;
  if(viewer==='local') return !!(g.over&&localRevealed&&localRevealed[owner]);
  if(viewer===owner) return !!g.over;
  return g.hide==='fine'&&!!g.over&&!!(g.reveal&&g.reveal[owner]);
}
function monView(g,mon,owner,viewer,localRevealed){ return !mon||mon.hidden||canSee(g,owner,viewer,localRevealed)?mon:hintOf(mon,g.mode); }
// ---------- Il computer all'asta (Gioca su questo dispositivo contro il computer: g.cpu = 1, giocatore 2) ----------
// Statistiche base da statistiche-data.js (genera-statistiche.js). Asta classica: il computer valuta il Pokémon dalle
// statistiche base (i leggendari e misteriosi li vuole con più foga), cerca sinergie di meteo con la sua squadra
// (chi porta pioggia/sole/sabbia/neve + chi ne approfitta) ed evita troppi doppioni di tipo. Nelle altre modalità
// (tipo, numero, colore, verso) non sa chi è: offre "a sentimento".
const STATS = typeof STAT_DATA!=='undefined' ? STAT_DATA : {};
const WEATHER_SET={abil:{'Drizzle':'rain','Primordial Sea':'rain','Drought':'sun','Desolate Land':'sun','Orichalcum Pulse':'sun','Sand Stream':'sand','Snow Warning':'snow'},
  move:{'Rain Dance':'rain','Sunny Day':'sun','Sandstorm':'sand','Snowscape':'snow','Chilly Reception':'snow'}};
const WEATHER_USE={abil:{'Swift Swim':'rain','Rain Dish':'rain','Hydration':'rain','Dry Skin':'rain','Chlorophyll':'sun','Solar Power':'sun','Flower Gift':'sun','Protosynthesis':'sun','Harvest':'sun',
  'Sand Rush':'sand','Sand Force':'sand','Slush Rush':'snow','Ice Body':'snow'},
  move:{'Thunder':'rain','Hurricane':'rain','Solar Beam':'sun','Solar Blade':'sun','Blizzard':'snow','Aurora Veil':'snow','Shore Up':'sand'}};
function cpuWeather(m,format,tier){
  const r={sets:new Set(),uses:new Set()};
  for(const s of setsFor(m,format||'singolo',tier)){
    const ab=s.abilita; if(WEATHER_SET.abil[ab]) r.sets.add(WEATHER_SET.abil[ab]); if(WEATHER_USE.abil[ab]) r.uses.add(WEATHER_USE.abil[ab]);
    for(const x of s.mosse||[]){ if(WEATHER_SET.move[x]) r.sets.add(WEATHER_SET.move[x]); if(WEATHER_USE.move[x]) r.uses.add(WEATHER_USE.move[x]); } }
  return r;
}
// Quanto vale "mon" per la squadra del giocatore p: circa 0 (scarso) … 1,5 (da prendere a ogni costo)
function cpuScore(g,mon,p){
  const st=STATS[mon.name]; let sc;
  if(st){ const bst=st.reduce((a,b)=>a+b,0), off=Math.max(st[1],st[3]), spe=st[5];
    const n=(x,lo,hi)=>Math.max(0,Math.min(1,(x-lo)/(hi-lo)));
    sc=0.6*n(bst,400,700)+0.25*n(off,70,150)+0.15*n(spe,40,130); }
  else sc=0.45;
  if(mon.legendary||mon.mythical) sc*=1.35;                          // leggendari: più foga
  const ms=megaSetsOf(g.tier); if((ms&&ms[mon.name])||(g.tier==='champions'&&setsFor(mon,g.format,g.tier).some(s=>s.mega))) sc+=0.08; // ha una Mega
  // sinergie di meteo con la squadra attuale
  const team=g.teams[p], w=cpuWeather(mon,g.format,g.tier), tw=team.map(m=>cpuWeather(m,g.format,g.tier));
  const teamSets=new Set(), useCount={};
  tw.forEach(x=>{ x.sets.forEach(v=>teamSets.add(v)); x.uses.forEach(v=>useCount[v]=(useCount[v]||0)+1); });
  for(const v of w.uses) if(teamSets.has(v)){ sc+=0.22; break; }    // ne approfitta: c'è già chi porta quel meteo
  for(const v of w.sets) if(useCount[v]){ sc+=0.1+0.12*Math.min(2,useCount[v]); break; } // porta il meteo a chi ne approfitta
  if(w.sets.size&&teamSets.size&&![...w.sets].some(v=>teamSets.has(v))) sc-=0.12; // meteo in conflitto
  // troppi doppioni di tipo
  const same=team.filter(m=>[m.type,m.type2].some(x=>x&&(x===mon.type||x===mon.type2))).length;
  sc-=0.06*Math.min(3,same);
  return Math.max(0,sc);
}
// Offerta massima che il computer è disposto a fare per il Pokémon all'asta (calcolata una volta per asta)
function cpuLimit(g,p){
  const a=g.auction; if(!a) return 0;
  if(a.cpuMax!=null) return a.cpuMax;
  const rnd=g.rnd||Math.random, slots=TEAM_SIZE-g.teams[p].length, avg=g.coins[p]/Math.max(1,slots);
  const sc=g.mode==='classica'?cpuScore(g,a.mon,p):0.25+0.55*rnd();   // al buio: a sentimento
  // 0,42 = Pokémon nella media: offre circa la sua quota di monete; più forte = di più. Verso la fine le monete avanzate non servono a niente: spende di più.
  let f=Math.max(0.3,Math.min(3,Math.pow(sc/0.42,1.5)));
  f*=Math.sqrt(Math.max(1,avg/(g.startCoins/TEAM_SIZE)));          // più ricco del previsto: spende di più
  if(slots===2) f*=1.3; if(slots===1) f=Math.max(f,sc>=0.3?3:1.2);
  let lim=Math.round(avg*f*(0.85+0.3*rnd()));
  lim=Math.max(1,Math.min(maxBid(g,p),lim));
  a.cpuMax=lim; return lim;
}
// Mossa del computer se tocca a lui: {act:'raise',amount} oppure {act:'pass'}; null se non tocca a lui
function cpuMove(g,p){
  const a=g.auction; if(!a||a.turn!==p||g.over) return null;
  const lim=cpuLimit(g,p), cap=maxBid(g,p);
  if(a.bid>=lim||a.bid>=cap) return {act:'pass'};
  const rnd=g.rnd||Math.random; let amt=a.bid+1;
  if(lim-a.bid>4&&rnd()<0.35) amt=a.bid+1+Math.floor(rnd()*Math.min(3,lim-a.bid-1)); // ogni tanto un rilancio più deciso
  return {act:'raise',amount:Math.min(amt,lim,cap)};
}
function exportText(team, format, choice, tier, edits){
  const ss=teamSets(team, format, choice, tier, edits);
  return team.map((m,i)=>ss[i]?setText(m,ss[i]):m.name).join('\n\n');
}

const LANGS=[['it','Italiano'],['en','English']];
function detectLang(){
  try{const s=localStorage.getItem('incanto-lang'); if(s&&I18N[s]) return s;}catch(e){}
  return /^it\b/i.test(navigator.language||'')?'it':'en';
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(3,'0');
function ink(hex){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return (0.299*r+0.587*g+0.114*b)>150?'#142033':'#FFFFFF';}
const tchip=k=>`<span class="tchip" style="background:${TYPE_COLORS[k]};color:${ink(TYPE_COLORS[k])}">${typeName(k)}</span>`;
// Nome del giocatore: se il campo è vuoto si usa "Giocatore 1"/"Player 1" nella lingua scelta
const name=i=>esc(ui.game&&ui.game.cpu===i&&!ui.online?t('cpu.name'):(ui.names[i]||t('player',i+1)));
const formOf=m=>m.form;
// Pokémon come lo vede chi guarda questo schermo (vedi monView)
const V=(mon,owner)=>ui.game?monView(ui.game,mon,owner,ui.online?ui.online.me:'local',ui.revealLocal):mon;
const disp=m=>esc(m.display)+(m.shiny?' ✨':'');
const tchips=m=>tchip(m.type)+(m.type2?tchip(m.type2):'');

// Il colore Pokédex si mostra solo nella modalità per colore; nelle altre i Pokémon usano uno stile neutro.
const colorStyle=(m,mode)=>{if(mode!=='colore')return 'background:var(--bg);color:var(--ink)';const c=COLOR_HEX[m.color];return `background:${c};color:${ink(c)}`;};
// Sprite animati scaricati da scarica-sprite.js (sprite-data.js). Se manca il file o l'immagine non si carica,
// resta visibile il numero di Pokédex. Gli shiny usano la cartella "-shiny" (sprites/ani-shiny, sprites/gen5-shiny),
// con ripiego sullo sprite normale.
const SPRITES=typeof SPRITE_DATA!=='undefined'?SPRITE_DATA:{};
const shinyPath=p=>p.replace(/^sprites\/(ani|gen5)\//,(x,d)=>'sprites/'+d+'-shiny/');
const spr=(m,cls)=>{const p=SPRITES[m.name]; if(!p) return '';
  if(m.shiny) return `<img class="${cls||''}" src="${esc(shinyPath(p))}" alt="" data-local="${esc(p)}" onerror="if(this.dataset.local){this.src=this.dataset.local;this.dataset.local='';}else this.remove();">`;
  return `<img class="${cls||''}" src="${esc(p)}" alt="" onerror="this.remove()">`;};
function ball(m,mode){return `<div class="ball sp${m.shiny?' shiny':''}" style="${colorStyle(m,mode)}" aria-hidden="true">${spr(m)}<span>${pad(m.dex)}</span></div>`;}
function face(m,mode,reveal){
  if(reveal||mode==='classica') return `<div class="face">${m.shiny?`<div class="shinyban" role="status">${t('shinyBan')}</div>`:''}${ball(m,mode)}<h2>${disp(m)}</h2><div class="chips">${m.shiny?'<span class="chip shinychip">✨ Shiny</span>':''}${tchips(m)}${formOf(m)?`<span class="chip">${t('formOf',formOf(m))}</span>`:''}${mode==='colore'?`<span class="chip">${t('colorChip',colorName(m.color))}</span>`:''}<span class="chip">${t('dexNo')} ${pad(m.dex)}</span></div></div>`;
  if(mode==='verso') return `<div class="face"><div class="ball q" aria-hidden="true">♪</div><span class="label">${t('cry.label')}</span><button class="btn big play2" data-act="playcry">🔊 ${t('cry.play')}</button><p class="muted" style="font-size:12px;margin:6px 0 0">${t('cry.tip')}</p></div>`;
  if(mode==='tipo') return `<div class="face"><div class="ball q">?</div><span class="label">${t('primaryType')}</span><span class="tchip" style="font-size:24px;padding:8px 24px;background:${TYPE_COLORS[m.type]};color:${ink(TYPE_COLORS[m.type])}">${typeName(m.type)}</span></div>`;
  if(mode==='numero') return `<div class="face"><div class="ball q">?</div><span class="label">${t('dexNumber')}</span><div class="big">${t('dexNo')} ${pad(m.dex)}</div></div>`;
  const c=COLOR_HEX[m.color];
  return `<div class="face"><div class="ball" style="background:${c};border-color:var(--ink)" aria-hidden="true"></div><span class="label">${t('color')}</span><div class="big">${colorName(m.color)}</div></div>`;
}

// Ciclo della scena (solo schermata iniziale): a ogni colpo di martelletto la carta cambia faccia e resta così fino al
// colpo successivo, alternando "?" e un Pokémon a caso della nostra lista;
// ogni 5° Pokémon rivelato è shiny (4 normali, poi 1 shiny). A ogni giro cambia anche il numero del lotto.
function sceneCycle(scene){
  clearTimeout(scene._t1); clearTimeout(scene._t2);
  const st=scene.querySelector('.s-stamp'), rnd=(a,b)=>a+Math.random()*(b-a);
  if(st){ st.style.setProperty('--sx',rnd(-26,26).toFixed(0)+'px'); st.style.setProperty('--sy',rnd(-16,12).toFixed(0)+'px');
    st.style.setProperty('--sr',rnd(-20,9).toFixed(0)+'deg'); st.style.setProperty('--ss',Math.random()<.3?(Math.random()<.5?.8:1.18):1); }
  const lotEl=scene.querySelector('.s-lot');
  if(lotEl) lotEl.textContent=(ui.lang==='en'?'LOT No. ':'LOTTO N. ')+(1+Math.floor(Math.random()*999));
  scene._n=(scene._n||0)+1;
  const mostra=scene._n%2===0; // giri pari: Pokémon; giri dispari: "?"
  scene._t1=setTimeout(()=>{
    if(!mostra){ scene.classList.remove('revealed','is-shiny'); return; }
    scene._p=(scene._p||0)+1;
    const cands=POOL.filter(m=>SPRITES[m.name]);
    const shiny=scene._p%5===0;
    const pool=shiny?cands.filter(m=>!SHINY_LOCK.includes(m.name)):cands;
    const m=pool[Math.floor(Math.random()*pool.length)];
    scene.querySelector('.s-mon').setAttribute('href', shiny?shinyPath(SPRITES[m.name]):SPRITES[m.name]);
    scene.classList.add('revealed'); scene.classList.toggle('is-shiny',shiny);
  },3000);
}
// Il ciclo riparte a ogni giro dell'animazione della carta (anche dopo che la pagina viene ridisegnata)
['animationstart','animationiteration'].forEach(ev=>document.addEventListener(ev,e=>{
  if(e.animationName==='scard'){ const sc=e.target.closest&&e.target.closest('.scene'); if(sc) sceneCycle(sc); }
}));

// Timbro "AGGIUDICATO!" con tante monete quante quelle spese; la festa cresce ogni 5 monete (livelli 0-4).
// Parte una sola volta per aggiudicazione (ui.celebN).
function celebrate(g){
  // ui.celebN = quante aste concluse c'erano all'ultima schermata: si festeggia solo quando aumentano
  // (così dopo un "Annulla asta" la nuova aggiudicazione si festeggia di nuovo, e chi rientra non rivede la vecchia)
  const l=g.last, k=g.history.length, prev=ui.celebN; ui.celebN=k;
  if(!l||g.auction||prev==null||k<=prev) return '';
  const lv=Math.min(4,Math.floor(l.price/5)), n=Math.min(l.price,40), R=(a,b)=>a+Math.random()*(b-a);
  const monete=Array.from({length:n},()=>`<i class="cc" style="--dx:${R(-1,1)*(80+lv*45)|0}px;--dy:${-R(50,110+lv*45)|0}px;--r:${R(-540,540)|0}deg;--d:${R(0,.25+lv*.12).toFixed(2)}s"></i>`).join('');
  const colori=['#E3350D','#FFCB05','#2A75BB','#7B3FD6','#2E8B3E','#FF8FC8'];
  // Coriandoli (da 20 monete in su): pioggia su tutto lo schermo, aggiunta fuori dalla pagina che si ridisegna
  if(lv>=4) setTimeout(()=>{ document.querySelectorAll('.cel-confetti').forEach(e=>e.remove());
    document.body.insertAdjacentHTML('beforeend',`<div class="cel-confetti" aria-hidden="true">${Array.from({length:44+Math.min(40,(l.price-20)*2)},(_,i)=>`<b style="--x:${R(0,100).toFixed(1)}%;--d:${R(0,.9).toFixed(2)}s;--c:${colori[i%colori.length]};--w:${R(.7,1.3).toFixed(2)}"></b>`).join('')}</div>`);
    setTimeout(()=>document.querySelectorAll('.cel-confetti').forEach(e=>e.remove()),4200); },0);
  return `<div class="celebrate lv${lv}" aria-hidden="true">${lv>=3?'<div class="cel-rays"></div>':''}${lv>=2?'<div class="cel-flash"></div>':''}<div class="cel-stamp">${esc(t('soldStamp'))}${'!'.repeat(Math.max(0,Math.min(2,lv-2)))}</div>${monete}</div>`;
}

// ---------- Torre Lotta (modalità storia contro il computer) ----------
// Squadra casuale; a ogni piano un allenatore casuale. Più si sale, più forti sono i suoi Pokémon e più furba la sua IA:
// piani 1-3 mosse a caso, 4-7 attacca bene, 8-14 calcola i danni e cambia Pokémon, 15+ senza errori; ogni 10 piani un "Asso".
const TOWER_KEY='incanto-torre';
const TW_NAMES={m:['Marco','Luca','Enea','Leo','Dario','Teo','Ugo','Pietro','Bruno','Ettore','Elio','Ivo'],f:['Giulia','Sara','Nina','Alba','Irene','Viola','Greta','Mia','Livia','Zoe','Bianca','Clara']};

const TW_GEN=['m','m','x','f','f','x','f','m','f','x','x','m','f','x','m','x','m','f'];
const TW_CLASS={it:['Escursionista','Pescatore','Karateka','Scienziata','Ragazza pic-nic','Fantallenatore','Domatrice di draghi','Veterano','Nuotatrice','Chef','Ninja','Archeologo','Ballerina','Medium','Cavaliere','Pilota','Montanaro','Studentessa'],
  en:['Hiker','Fisher','Black Belt','Scientist','Picnicker','Cool Trainer','Dragon Tamer','Veteran','Swimmer','Chef','Ninja','Archaeologist','Dancer','Medium','Knight','Pilot','Mountaineer','Student']};
const TW_LINES={it:['Vediamo se arrivi in cima!','Non sarà una passeggiata.','Ho allenato la mia squadra per questo momento.','La Torre non perdona gli errori.','Fammi vedere di cosa sei capace!','Da qui non passa nessuno.'],
  en:['Let\'s see if you reach the top!','This won\'t be a walk in the park.','I trained my team for this moment.','The Tower forgives no mistakes.','Show me what you\'ve got!','Nobody gets past me.']};
// Modalità della Torre: formato (singolo/doppio) × gruppo di Pokémon. Ogni combinazione ha la sua scalata, record e statistiche.
// "Nat Dex Uber" (uber) ha preso il posto di "Nat Dex OU (Mega)": compare solo quando il gioco conosce il gruppo (POOL_TIERS.uber)
const TW_FORMATS=['singolo','doppio'], TW_GROUPS=['tutti','ou'].concat(POOL_TIERS.uber?['uber']:[],['uu','champions']);
const TW_KEYS=TW_FORMATS.flatMap(f=>TW_GROUPS.map(g=>f+'-'+g));
function twMode(key){ key=TW_KEYS.includes(key)?key:'singolo-tutti'; const [format,tier]=key.split('-'); return {key,format,tier}; }
function twCur(){ return twMode(ui.twMode||(profMe()&&profMe().twMode)||'singolo-tutti'); }
const twModeName=key=>{ const m=twMode(key); return t('fmt.'+m.format)[0]+' · '+t('poolName.'+m.tier); };
function twTiers(f){ if(twBO3(f)) return ['Uber','AG','OU']; if(f<=3) return ['RU','NFE','LC']; if(f<=5) return ['UU','UUBL','OU']; if(f<=9) return ['OU','UUBL','Uber']; return ['Uber','AG','OU']; }
// IA a 10 livelli (lotta.js): piano → livello scelto dall'utente. 5 = mini boss; 10, 15, 20 e poi ogni 10 piani = Asso con BO3
const TW_LV=[0,1,2,3,4,6,5,6,7,7,8,8,8,8,8,9,9,9,9,9,10];
function twAI(f){ return f>=21?10:TW_LV[Math.max(1,f)]; }
function twBO3(f){ return f===10||f===15||f===20||(f>=30&&f%10===0); }
const twMini=f=>f===5;
// dal 4° piano gli allenatori usano i Pokémon più forti del gruppo (in base al tier National Dex)
const TIER_RANK={AG:9,Uber:8,OU:7,UUBL:6,UU:5,RUBL:4,RU:3,NFE:2,LC:1};
// nel gruppo Uber conta anche la Mega: Kangaskhan (RU) con la sua Mega vale come un Uber/OU
const megaRank=m=>{ const L=typeof MEGA_UBER!=='undefined'&&MEGA_UBER[m.name]; return Array.isArray(L)?Math.max(0,...L.map(x=>TIER_RANK[x&&x.tier]||0)):0; };
const bst=(m,M)=>Math.max(TIER_RANK[m.tier]||3,M&&M.tier==='uber'?megaRank(m):0)+Math.random()*0.9;
function twStrong(pool,f,M){ if(f<=3||pool.length<14) return pool; const q=f<=6?.5:.3; const sorted=pool.slice().sort((a,b)=>bst(b,M)-bst(a,M)); return sorted.slice(0,Math.max(12,Math.round(pool.length*q))); }
// nel gruppo Uber al massimo 2 leggendari e 2 mitici per squadra (come nell'asta)
function twPick(pool,n,M){ const out=[], dex=new Set(), cap={legendary:0,mythical:0}, lim=M.tier==='uber'?2:99;
  for(const m of shuffle(pool)){ if(out.length>=n) break; if(dex.has(m.dex)||!setsFor(m,M.format,M.tier).length) continue;
    const k=m.legendary?'legendary':m.mythical?'mythical':null; if(k&&cap[k]>=lim) continue; if(k) cap[k]++; dex.add(m.dex); out.push(m.name); } return out; }
// Champions: in ogni squadra almeno un Pokémon che può megaevolversi
function twMegaOk(names,M,pool){ if(M.tier!=='champions') return names; const canMega=n=>setsFor(MON_BY_NAME.get(n),M.format,M.tier).some(s=>s.mega);
  if(names.some(canMega)) return names; const dex=new Set(names.map(n=>MON_BY_NAME.get(n).dex)); const c=shuffle(pool).find(m=>!dex.has(m.dex)&&setsFor(m,M.format,M.tier).some(s=>s.mega));
  if(c) names=names.slice(0,5).concat(c.name); return names; }
function twChoice(names,M){ const c={}; for(const n of names){ const k=setsFor(MON_BY_NAME.get(n),M.format,M.tier).length; c[n]=Math.floor(Math.random()*k); } return c; }
// avatar dell'allenatore (disegni originali di avatar.js): l'Asso ha il Campione, alcune classi il loro disegno, gli altri uno a caso del suo genere
// immagini degli allenatori dei giochi (avatar.js, sprite di Showdown): per classe (con il genere giusto), Asso = un campione, Mini Boss = un rivale
const TW_AV_CLS={0:'backpacker',1:'fisherman',2:{m:'blackbelt',f:'battlegirl'},5:{m:'acetrainer',f:'acetrainerf'},8:'swimmerf',13:{f:'psychicf'},16:'hiker',12:{f:'kimonogirl'}};
const twAvGroup=k=>{ const g=Avatar.groups&&Avatar.groups.find(x=>x.key===k); return g?g.ids:[]; };
function twAvatar(boss,ci,gen,mini){ if(typeof Avatar==='undefined') return undefined; gen=gen==='f'?'f':'m';
  const pickG=l=>{ l=l.filter(x=>Avatar.gender(x)===gen); return l.length?l[Math.random()*l.length|0]:null; };
  let id=boss?pickG(twAvGroup('champ')):mini?pickG(twAvGroup('rival')):null;
  if(!id&&!boss&&!mini){ const c=TW_AV_CLS[ci]; const x=typeof c==='string'?c:c&&c[gen]; if(x&&Avatar.gender(x)===gen) id=x; }
  if(!id) id=pickG(twAvGroup('class').concat(twAvGroup('prot'))) || Avatar.random('trainers',gen);
  return Avatar.fix(id); }
// avversari: nel gruppo "Tutti" i Pokémon diventano più forti salendo; negli altri gruppi si resta nel gruppo e cresce l'IA
function twTrainer(f,M){ const boss=twBO3(f), mini=twMini(f), legends=f>=15||boss;
  let pool=M.tier==='tutti'?POOL.filter(m=>twTiers(f).includes(m.tier)&&(legends||!(m.legendary||m.mythical))):filterPool(POOL,{tier:M.tier,legends:M.tier==='champions'?false:(f>=8||boss)});
  if(pool.length<6) pool=filterPool(POOL,{tier:M.tier,legends:true});
  pool=twStrong(pool,f,M);
  const team=twMegaOk(twPick(pool,6,M),M,pool), lang=ui.lang==='en'?'en':'it';
  const ci=Math.random()*TW_CLASS.it.length|0, gen=boss?(Math.random()<.5?'m':'f'):(TW_GEN[ci]==='x'?(Math.random()<.5?'m':'f'):TW_GEN[ci]), nl=TW_NAMES[gen];
  return {name:nl[Math.random()*nl.length|0], cls:boss?(f>=20?(lang==='en'?'Tower Master':'Maestro della Torre'):(lang==='en'?'Tower Ace':'Asso della Torre')):mini?'Mini Boss':TW_CLASS[lang][ci],
    line:TW_LINES[lang][Math.random()*TW_LINES[lang].length|0], team, choice:f>=4?Object.fromEntries(team.map(n=>[n,0])):twChoice(team,M), ai:twAI(f), boss, mini, bo3:boss, avatar:twAvatar(boss,ci,gen,mini)}; }
// La scalata è legata al profilo (salvata dentro il profilo, quindi va anche con "Esporta"), una per modalità. Si salva solo
// tra una lotta e l'altra: una lotta lasciata a metà (uscita o pagina chiusa) conta come sconfitta. A ogni tentativo si possono
// estrarre fino a 3 squadre e sceglierne una; dopo la prima lotta la squadra non si cambia più.
function twDraw(M){ const pool=filterPool(POOL,{tier:M.tier,legends:true}); const team=twMegaOk(twPick(pool,6,M),M,pool); return {team,choice:twChoice(team,M)}; }
function twCheck(o){ return o&&Array.isArray(o.draws)&&o.draws.length>=1&&o.draws.length<=3&&o.draws.every(d=>d&&Array.isArray(d.team)&&d.team.length===6&&d.team.every(n=>MON_BY_NAME.has(n)))&&o.trainer&&Array.isArray(o.trainer.team)&&o.trainer.team.every(n=>MON_BY_NAME.has(n)); }
// Il gruppo "Nat Dex OU (Mega)" non c'è più: scalate, record e statistiche *-megaou vengono cancellati da tutti i profili (scelta dell'utente, 24/11/2026)
function twPurgeOld(){ const all=profAll(); let ch=false; for(const k in all){ const p=all[k]; if(!p||typeof p!=='object') continue;
    for(const o of [p.runs,p.stats&&p.stats.torre]) if(o&&typeof o==='object') for(const x of Object.keys(o)) if(/-megaou$/.test(x)){ delete o[x]; ch=true; }
    if(typeof p.twMode==='string'&&/-megaou$/.test(p.twMode)){ delete p.twMode; ch=true; } }
  if(ch) profSaveAll(all); }
function twRuns(p){ const r=p&&p.runs&&typeof p.runs==='object'?p.runs:{}; if(p&&p.run&&!r['singolo-tutti']) r['singolo-tutti']=p.run; return r; } // vecchi profili: una sola scalata
function twLoad(key){ const p=profMe(); if(!p) return null; const M=twMode(key||twCur().key), o=twRuns(p)[M.key]; if(!twCheck(o)) return null;
  o.pick=Math.min(Math.max(0,o.pick|0),o.draws.length-1);
  o.team=o.draws[o.pick].team; o.choice=o.draws[o.pick].choice; o.mode=M.key; o.trainer.ai=twAI(o.floor); o.trainer.bo3=twBO3(o.floor); o.trainer.mini=twMini(o.floor);
  if(typeof Avatar!=='undefined'&&(!o.trainer.avatar||!Avatar.valid(o.trainer.avatar))){ o.trainer.avatar=twAvatar(o.trainer.boss,-1,TW_NAMES.f.includes(o.trainer.name)?'f':'m',o.trainer.mini); twSave(o); } // scalate salvate prima degli avatar (o con i vecchi disegni)
  return o; }
function twSave(o){ const all=profAll(), k=localStorage.getItem(PROF_ME); if(!k||!all[k]) return; const M=twMode(o.mode); const c=Object.assign({},o); delete c.team; delete c.choice; delete c.mode;

function twNew(key){ if(!profMe()) return null; const M=twMode(key||twCur().key);

const twText=(names,choice,M)=>fightTeam({teams:[names.map(n=>MON_BY_NAME.get(n))],format:M.format,tier:M.tier},0,choice);
// Serie al meglio di 3 dei piani Asso: resta in memoria finché la serie non finisce (chiudere a metà conta come sconfitta).

let TW_SER=null;

      if(S.w[i]>=2){ S.done=true; S.won=i===0; return {msg:t('bo.won',[me,foe][i],score),label:lab}; } S.n++; return {msg:t('bo.score',me,score,foe),next:t('bo.next',S.n),label:lab}; }}:{};

  try{ if(navigator.clipboard&&window.isSecureContext) return navigator.clipboard.writeText(s).then(()=>true,()=>old()); }catch(e){}
  return Promise.resolve(old()); }

// ===================== Modalità online (due dispositivi) =====================
// Collegamento diretto tra i due browser con PeerJS (lib/peerjs.min.js, licenza MIT), caricato solo quando serve.
// Chi crea la partita ("host", giocatore 1 / testa) tiene lo stato vero della partita: controlla turni e offerte
// e manda lo stato aggiornato all'altro ("guest", giocatore 2 / croce), che invia solo le sue azioni.
const ONLINE_PREFIX='pkmn-incanto-';
const CODE_ABC='ABCDEFGHJKMNPQRSTUVWXYZ23456789';
const newRoomCode=()=>Array.from({length:5},()=>CODE_ABC[Math.floor(Math.random()*CODE_ABC.length)]).join('');
let peerLibPromise=null;
// ---------- Server "relay" (TURN) ----------
// Il collegamento diretto tra due browser spesso non riesce quando sono su reti diverse (rete mobile, router con doppio NAT):
// serve un server TURN che faccia da ponte. Quello gratuito di PeerJS non risponde più (verificato il 22/11/2026).
// TURN_CFG: servizio con chiave pubblica che restituisce le credenziali (es. Metered: https://<app>.metered.live/api/v1/turn/credentials?apiKey=...).
// Finché è vuoto si usa solo lo STUN di Google (funziona solo quando la rete permette il collegamento diretto).
const TURN_CFG={url:'https://pkmn_incanto.metered.live/api/v1/turn/credentials?apiKey=82e7ef7e266a7da02c855197be3a5822bb38'};
let iceCache=null;
// Per le prove: con ?ponte=1 nell'indirizzo si passa SOLO dal server ponte, come se i due giocatori fossero su reti
// che bloccano il collegamento diretto (così si prova il TURN anche con due schede dello stesso computer).
const FORCE_RELAY=/[?&]ponte=1(&|$)/.test(location.search);
async function iceConfig(){ const c=await iceServersList(); return FORCE_RELAY?{iceServers:c,iceTransportPolicy:'relay'}:{iceServers:c}; }
async function iceServersList(){ const base=[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
  if(!TURN_CFG.url) return base;
  if(iceCache&&Date.now()-iceCache.at<30*60*1000) return base.concat(iceCache.list);
  try{ const r=await fetch(TURN_CFG.url,{cache:'no-store'}); const list=await r.json();
    const ok=(Array.isArray(list)?list:[]).filter(x=>x&&x.urls&&(typeof x.urls==='string'||Array.isArray(x.urls))).slice(0,8).map(x=>({urls:x.urls,username:x.username,credential:x.credential}));
    iceCache={at:Date.now(),list:ok}; return base.concat(ok); }catch(e){ return base; } }
// Dopo il collegamento guarda quale strada usa (diretta o server ponte): si mostra nella stanza per capire i problemi di rete
async function detectRoute(o,conn){ try{ const pc=conn.peerConnection; if(!pc||!pc.getStats) return; const st=await pc.getStats(); let pair=null;
  st.forEach(r=>{ if(!pair&&r.type==='transport'&&r.selectedCandidatePairId) pair=st.get(r.selectedCandidatePairId); });
  if(!pair) st.forEach(r=>{ if(!pair&&r.type==='candidate-pair'&&(r.selected||(r.nominated&&r.state==='succeeded'))) pair=r; });
  if(!pair) return; const l=st.get(pair.localCandidateId), rm=st.get(pair.remoteCandidateId);
  o.via=(l&&l.candidateType==='relay')||(rm&&rm.candidateType==='relay')?'relay':'direct';
  if(ui.online===o&&ui.screen==='lobby') render(); }catch(e){} }
function loadPeerLib(){
  if(window.Peer) return Promise.resolve();
  if(!peerLibPromise) peerLibPromise=new Promise((res,rej)=>{const s=document.createElement('script'); s.src='lib/peerjs.min.js';
    s.onload=res; s.onerror=()=>{peerLibPromise=null; rej(new Error('peerjs'));}; document.head.appendChild(s);});
  return peerLibPromise;
}
const isHost=()=>!!(ui.online&&ui.online.role==='host');
const isGuest=()=>!!(ui.online&&ui.online.role==='guest');
const oppName=()=>ui.online?name(1-ui.online.me):'';
const roomLink=code=>location.origin+location.pathname+'?stanza='+code;
function onlineSend(msg){ const c=ui.online&&ui.online.conn; if(c&&c.open){ try{c.send(msg);}catch(e){} } }
// Stato condiviso che l'host manda al guest. Il mazzo (Pokémon ancora da estrarre) NON viene inviato: le estrazioni
// le fa solo l'host, e un messaggio con centinaia di Pokémon sarebbe troppo grande per il collegamento diretto.
// Ciò che l'altro giocatore (guest, 1) non può vedere viene sostituito dall'indizio PRIMA di essere inviato.
function wireGame(g){ if(!g) return null; const c=Object.assign({},g); delete c.undo; delete c.rnd; c.deckLen=g.deck.length; c.deck=[];
  const v=(m,owner)=>monView(g,m,owner,1);
  c.teams=g.teams.map((tm,i)=>tm.map(m=>v(m,i)));
  c.history=g.history.map(h=>Object.assign({},h,{mon:v(h.mon,h.winner)}));
  c.last=g.last?Object.assign({},g.last,{mon:v(g.last.mon,g.last.winner)}):null;
  c.auction=g.auction?Object.assign({},g.auction,{mon:v(g.auction.mon,null)}):null;
  return c; }
function wireState(){
  const g=ui.game;
  return {t:'state', screen:ui.screen==='end'?'game':ui.screen, names:ui.names,
    settings:{format:ui.format,tier:ui.tier,legends:ui.legends,mode:ui.mode,coins:ui.coins,hide:ui.hide},
    flip:ui.flip, game:wireGame(g), canUndo:!!(g&&canUndo(g)), undoReq:ui.online.undoReq||null};
}
function broadcast(){ if(isHost()) onlineSend(wireState()); }
function setDraftFromGame(){ const g=ui.game; if(g&&g.auction) ui.draft=String(g.auction.bid+1); }

// Partite casuali senza server: ci sono "posti in coda" numerati (stanze coda-1, coda-2, ...). Chi cerca prova a entrare
// nel primo posto: se c'è qualcuno che aspetta ci gioca contro (con le sue impostazioni); se il posto è libero lo occupa
// e aspetta; se è già pieno (partita in corso) prova il posto successivo.
const QUEUE_SLOTS=10;
function findOpponent(slot){ slot=slot||1; if(slot>QUEUE_SLOTS){ ui.online={role:'guest',me:1,code:'',status:'queuefull',random:true}; ui.screen='lobby'; render(); return; }
  joinRoom(queueKey()+'-'+slot,{random:true,slot}); }
// Una coda diversa per ogni combinazione di impostazioni: si incontra solo chi ha scelto le stesse regole
function queueKey(){ return ['coda',ui.format==='doppio'?'d':'s',ui.tier,ui.legends?'l':'n',ui.mode,ui.mode==='classica'?'subito':ui.hide,Number(ui.coins)].join('-'); }
// ---------- Bacheca delle stanze (senza server) ----------
// Uno dei giocatori collegati tiene la "bacheca": occupa un indirizzo fisso sul centralino PeerJS e raccoglie le stanze
// in attesa. Gli altri si collegano a lui, mandano la propria stanza (ogni 8 s) e ricevono l'elenco. Se chi tiene la
// bacheca se ne va, il primo che se ne accorge prende il suo posto e gli altri rimandano le stanze: l'elenco si ricompone.
// Tutto ciò che arriva viene ricontrollato (cleanEntry), sia da chi tiene la bacheca sia da chi la legge.
const LOBBY_ID=ONLINE_PREFIX+'bacheca-1', LOBBY_MAX=40;
const LB={peer:null,isDir:false,dirConn:null,conns:new Map(),list:[],status:'off',key:'',myEntry:null,watching:false,timer:null,starting:false};
function cleanEntry(e){ if(!e||typeof e!=='object') return null; const k=e.k==='q'?'q':'r', id=String(e.id||'');
  if(k==='q'?!/^coda-[a-z0-9-]{5,70}-\d{1,2}$/.test(id):!/^[A-Z0-9]{4,8}$/.test(id)) return null;
  const s=e.s||{}; if(!FORMAT_KEYS.includes(s.format)||!POOL_KEYS.includes(s.tier)||!MODE_KEYS.includes(s.mode)||!HIDE_KEYS.includes(s.hide)) return null;
  const coins=Number(s.coins); if(!Number.isInteger(coins)||coins<TEAM_SIZE||coins>999) return null;
  return {id,k,n:String(e.n||'').slice(0,16),s:{format:s.format,tier:s.tier,legends:!!s.legends,mode:s.mode,coins,hide:s.mode==='classica'?'subito':s.hide}}; }
function myLobbyEntry(){ const o=ui.online; if(!o||o.role!=='host'||o.status!=='waiting'||ui.game||(o.conn&&o.conn.open)) return null;
  if(!o.random&&ui.listRoom===false) return null;
  return cleanEntry({id:o.random?queueKey()+'-'+(o.slot||1):o.code,k:o.random?'q':'r',n:ui.names[0]||'',
    s:{format:ui.format,tier:ui.tier,legends:ui.legends,mode:ui.mode,coins:Number(ui.coins),hide:ui.hide}}); }
function lobbyRender(){ if(ui.screen==='rooms') render(); }
function lobbySendAll(){ if(LB.isDir){ lobbyDirUpdate(); return; }
  const c=LB.dirConn; if(c&&c.open) try{ c.send({t:'hi',e:LB.myEntry,w:LB.watching}); }catch(x){} }
function lobbyDirUpdate(){ const now=Date.now(), out=[], seen=new Set();
  for(const [c,r] of LB.conns){ if(now-r.at>25000){ LB.conns.delete(c); try{c.close();}catch(x){} } }
  const add=e=>{ if(e&&!seen.has(e.id)&&out.length<LOBBY_MAX){ seen.add(e.id); out.push(e); } };
  add(LB.myEntry); for(const r of LB.conns.values()) add(r.e);
  LB.list=out; const msg={t:'list',rooms:out};
  for(const [c,r] of LB.conns) if(r.w&&c.open) try{ c.send(msg); }catch(x){}
  lobbyRender(); }
function lobbyStop(){ clearInterval(LB.timer); LB.timer=null; const p=LB.peer; LB.peer=null; LB.isDir=false; LB.dirConn=null; LB.conns=new Map();
  LB.list=[]; LB.status='off'; LB.key=''; if(p) try{ p.destroy(); }catch(x){} }
function lobbyRetry(ms){ const p=LB.peer; LB.peer=null; LB.isDir=false; LB.dirConn=null; if(p) try{ p.destroy(); }catch(x){}
  setTimeout(()=>{ if(!LB.peer&&lobbyNeeded()) lobbyAsClient(); },ms); }
function lobbyNeeded(){ return ui.screen==='rooms'||!!myLobbyEntry(); }
async function lobbyStart(){ if(LB.peer||LB.starting) return; LB.starting=true; LB.status='connecting';
  try{ await loadPeerLib(); }catch(e){ LB.starting=false; LB.status='error'; lobbyRender(); return; }
  LB.ice=await iceConfig(); LB.starting=false; if(!lobbyNeeded()||LB.peer) return;
  clearInterval(LB.timer); LB.timer=setInterval(()=>{ if(!LB.peer) return; if(LB.isDir) lobbyDirUpdate(); else lobbySendAll(); },8000);
  lobbyAsClient(); }
function lobbyAsClient(){ const p=new Peer({debug:0,config:LB.ice||undefined}); LB.peer=p; LB.isDir=false;
  p.on('open',()=>{ if(LB.peer!==p) return; const c=p.connect(LOBBY_ID,{reliable:true,serialization:'json'}); LB.dirConn=c;
    c.on('open',()=>{ if(LB.peer!==p) return; LB.status='ok'; lobbySendAll(); lobbyRender(); });
    c.on('data',m=>{ if(LB.peer!==p||!m||m.t!=='list'||!Array.isArray(m.rooms)) return;
      LB.list=m.rooms.slice(0,LOBBY_MAX).map(cleanEntry).filter(Boolean); lobbyRender(); });
    c.on('close',()=>{ if(LB.peer===p) lobbyRetry(300+Math.random()*1500); }); });
  // nessuno tiene la bacheca: la prendo io
  p.on('error',e=>{ if(LB.peer!==p) return; if(e.type==='peer-unavailable'){ LB.peer=null; try{p.destroy();}catch(x){} lobbyAsDir(); }
    else { LB.status='error'; lobbyRender(); lobbyRetry(5000); } }); }
function lobbyAsDir(){ const p=new Peer(LOBBY_ID,{debug:0,config:LB.ice||undefined}); LB.peer=p; LB.isDir=true; LB.conns=new Map();
  p.on('open',()=>{ if(LB.peer!==p) return; LB.status='ok'; lobbyDirUpdate(); });
  p.on('connection',c=>{ if(LB.peer!==p) return; if(LB.conns.size>=80){ setTimeout(()=>c.close(),500); return; }
    LB.conns.set(c,{e:null,w:false,at:Date.now()});
    c.on('data',m=>{ if(LB.peer!==p||!m||m.t!=='hi') return; const r=LB.conns.get(c); if(!r) return;
      // al massimo un aggiornamento ogni 2 s per collegamento: quelli troppo ravvicinati si applicano dopo (vale l'ultimo)
      const apply=()=>{ r.wait=null; r.last=Date.now(); r.at=Date.now(); r.w=!!r.pend.w; r.e=cleanEntry(r.pend.e); if(LB.peer===p&&LB.conns.has(c)) lobbyDirUpdate(); };
      r.pend={e:m.e,w:m.w}; if(r.wait) return; const d=2000-(Date.now()-(r.last||0)); if(d>0) r.wait=setTimeout(apply,d); else apply(); });
    c.on('close',()=>{ if(LB.peer!==p) return; LB.conns.delete(c); lobbyDirUpdate(); }); });
  // qualcun altro l'ha presa un attimo prima: mi collego a lui
  p.on('error',e=>{ if(LB.peer!==p) return; if(e.type==='unavailable-id') lobbyRetry(300+Math.random()*1200);
    else if(['network','server-error','socket-error','browser-incompatible'].includes(e.type)){ LB.status='error'; lobbyRender(); lobbyRetry(5000); } }); }
// chiamata dopo ogni disegno: accende/spegne la bacheca e manda la propria stanza solo quando cambia
function lobbySync(){ const e=myLobbyEntry(), w=ui.screen==='rooms';
  if(!e&&!w){ if(LB.peer||LB.timer) lobbyStop(); return; }
  if(!LB.peer) lobbyStart();
  const key=JSON.stringify([e,w]); if(key!==LB.key){ LB.key=key; LB.myEntry=e; LB.watching=w; if(LB.peer) lobbySendAll(); } }
function vRooms(){
  const list=LB.list.filter(e=>!(LB.myEntry&&e.id===LB.myEntry.id));
  const card=e=>`<div class="note roomrow"><div class="rr-top"><b>${esc(e.n||t('player',1))}</b><span class="chip">${e.k==='q'?t('lobby.queue'):t('lobby.room')}</span></div>
    ${settingsChips(e.s)}<p class="muted" style="font-size:12px;margin:4px 0">${esc(showdownFormat(e.s.format,e.s.tier))}</p>
    <div class="center"><button class="btn sm" data-act="challenge" data-v="${esc(e.id)}">${t('lobby.challenge')}</button></div></div>`;
  return `<button class="btn ghost sm backlink" data-act="online">${t('back')}</button>
  <header class="brand"><h1><span class="h-poke">Pokémon</span> <span class="h-inc">Incanto</span></h1><p class="muted">${t('lobby.title')}</p></header>
  <section class="card"><span class="label">${t('lobby.title')}</span><p class="muted" style="font-size:14px">${t('lobby.sub')}</p>
   ${ui.msg?`<div class="err" role="alert">${esc(ui.msg)}</div>`:''}
   ${LB.status==='error'?`<div class="err" role="alert">${t('lobby.error')}</div>`:LB.status!=='ok'?`<p class="waitdots">${t('lobby.connecting')}</p>`:
     list.length?`<div class="rooms" aria-live="polite">${list.map(card).join('')}</div>`:`<p class="muted" aria-live="polite">${t('lobby.empty')}</p>`}
   <p class="hint" style="font-size:12px">ℹ️ ${t('lobby.note')}</p></section>`;
}
async function createRoom(opts){
  opts=opts||{};
  const o=ui.online={role:'host',me:0,code:opts.code||newRoomCode(),status:'opening',undoReq:null,random:!!opts.random,slot:opts.slot};
  ui.names[0]=ui.myName||''; ui.names[1]=''; ui.screen='lobby'; ui.game=null; ui.flip=null; render();
  try{ await loadPeerLib(); }catch(e){ o.status='error'; render(); return; }
  if(ui.online!==o) return;
  const ice=await iceConfig(); if(ui.online!==o) return;
  const peer=new Peer(ONLINE_PREFIX+o.code,{debug:0,config:ice}); o.peer=peer;
  peer.on('open',()=>{ if(ui.online===o){ o.status=o.conn&&o.conn.open?'connected':'waiting'; render(); } });
  peer.on('error',e=>{ if(ui.online!==o) return;
    if(e.type==='unavailable-id'){ peer.destroy(); ui.online=null; if(o.random) findOpponent(o.slot); else createRoom(); return; }
    if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'||e.type==='browser-incompatible'){ o.status='error'; render(); } });
  peer.on('connection',conn=>{
    if(ui.online!==o) return;
    if(o.conn&&o.conn.open){ conn.on('open',()=>{ conn.send({t:'full'}); setTimeout(()=>conn.close(),800); }); return; }
    attachConn(o,conn);
  });
}
async function joinRoom(code,opts){
  opts=opts||{};
  code=(opts.random||opts.raw)?code:String(code||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(!code){ ui.msg=t('online.needCode'); render(); return; }
  if(ui.online&&ui.online.peer) try{ui.online.peer.destroy();}catch(e){}
  const o=ui.online={role:'guest',me:1,code,status:opts.random?'searching':'connecting',undoReq:null,random:!!opts.random,slot:opts.slot,board:!!opts.fromBoard};
  ui.screen='lobby'; ui.msg=''; render();
  try{ await loadPeerLib(); }catch(e){ o.status='error'; render(); return; }
  if(ui.online!==o) return;
  const ice=await iceConfig(); if(ui.online!==o) return;
  const peer=new Peer({debug:0,config:ice}); o.peer=peer;
  peer.on('open',()=>{ if(ui.online===o) attachConn(o,peer.connect(ONLINE_PREFIX+code,{reliable:true,serialization:'json'})); });
  peer.on('error',e=>{ if(ui.online!==o) return;
    // partita casuale e posto libero: lo occupo e aspetto un avversario
    if(o.random&&e.type==='peer-unavailable'){ try{peer.destroy();}catch(x){} ui.online=null; createRoom({code:o.code,random:true,slot:o.slot}); return; }
    o.status=e.type==='peer-unavailable'?'notfound':'error'; render(); });
  setTimeout(()=>{ if(ui.online===o&&(o.status==='connecting'||o.status==='searching')){ o.status=TURN_CFG.url?'error':'blocked'; render(); } },15000);
}
function attachConn(o,conn){
  o.conn=conn;
  conn.on('open',()=>{ if(ui.online!==o) return; o.status='connected'; conn._ok=true; o.via=null; setTimeout(()=>detectRoute(o,conn),1200);
    if(o.role==='guest') conn.send({t:'hello',name:ui.myName||''}); else broadcast();
    render(); });
  conn.on('data',m=>{ if(ui.online===o) onlineMessage(m); });
  const persa=()=>{ if(ui.online!==o||o.conn!==conn) return;
    // collegamento mai aperto (es. tentativo fallito dell'amico): chi ha creato la stanza continua ad aspettare
    if(!conn._ok){ if(o.role==='host') o.conn=null; return; }
    if(o.status!=='left'){ o.status='lost'; ui.askUndo=false; render(); } };
  conn.on('close',persa); conn.on('error',persa);
}
function onlineMessage(m){
  const o=ui.online; if(!m||typeof m!=='object') return;
  if(m.t==='bye'){ o.status='left'; ui.askUndo=false; render(); return; }
  // messaggi della lotta: se la lotta non è ancora aperta (l'amico sta scaricando il motore) si tengono da parte
  if(['bl','bc','bff','bexit','chat','bav'].includes(m.t)){ if(typeof Lotta!=='undefined'&&Lotta.isOpen()) Lotta.net(m); else if((o.bq=o.bq||[]).length<500) o.bq.push(m); return; }
  if(m.t==='bstart'&&isGuest()){ o.bq=[]; guestFight(m); return; }
  if(isHost()){
    if(m.t==='act'&&!['draw','raise','pass','reveal','fight'].includes(m.a)) return; // il guest può solo estrarre, rilanciare e passare
    // se l'amico rientra (pagina ricaricata) senza nome durante la partita, si tiene quello di prima
    if(m.t==='hello'){ const nn=String(m.name||'').slice(0,16); if(nn||!ui.game) ui.names[1]=nn; o.status='connected'; broadcast(); render(); }
    else if(m.t==='act'){ const err=hostApply(m.a,m.d||{},1); if(err) onlineSend({t:'err',code:err}); broadcast(); render(); }
    else if(m.t==='undo-req'){ if(ui.game&&canUndo(ui.game)&&!o.undoReq){ o.undoReq={from:1}; broadcast(); render(); } }
    else if(m.t==='undo-answer'){ if(o.undoReq&&o.undoReq.from===0){
        if(m.ok){ undoLast(ui.game); setDraftFromGame(); } else ui.msg=t('online.undoRefused');
        o.undoReq=null; broadcast(); render(); } }
  } else {
    if(m.t==='state'){ applyWireState(m); render(); }
    else if(m.t==='err'){ const c=String(m.code||''); if(/^(turn|int|min\|\d{1,3}|max\|\d{1,3})$/.test(c)){ ui.msg=errText(c); render(); } }
    else if(m.t==='full'){ if(o.random){ try{o.peer.destroy();}catch(x){} ui.online=null; findOpponent((o.slot||1)+1); } else { o.status='full'; render(); } }
    else if(m.t==='undo-refused'){ ui.msg=t('online.undoRefused'); render(); }
    else if(m.t==='cry'){ gotCry(m); }
  }
}
// ---------- Sicurezza: tutto ciò che arriva dall'altro dispositivo viene ricostruito con dati fidati ----------
// I Pokémon sono presi dalla nostra lista per nome (mai i campi ricevuti), i numeri sono forzati in un intervallo,
// impostazioni e schermate devono essere valori ammessi; tutto il resto viene scartato. Così un avversario che
// modifica la sua pagina non può inserire testo o codice nella pagina dell'altro.
const MON_BY_NAME=new Map(POOL.map(m=>[m.name,m]));
const wInt=(v,min,max,def)=>{ v=Number(v); return Number.isFinite(v)?Math.max(min,Math.min(max,Math.round(v))):def; };
const wPl=v=>v===1?1:0;
function wMon(m){
  if(m&&m.hidden===true) return {hidden:true,name:'?',display:'?',dex:wInt(m.dex,0,2000,0),type:TYPE_COLORS[m.type]?m.type:null,type2:null,color:COLOR_HEX[m.color]?m.color:null,form:null};
  const b=m&&typeof m.name==='string'&&MON_BY_NAME.get(m.name); if(!b) return null;
  return m.shiny===true&&!SHINY_LOCK.includes(b.name)?Object.assign({},b,{shiny:true}):b; }
function cleanWireGame(g){

function hostApply(a,d,player){

  if(a==='fight'){ if(player!==1||!g||!g.over) return null; ui.online.guestChoice=cleanChoice(d&&d.choice); ui.online.guestEdit=cleanEditWire(d&&d.edit); ui.bo=d&&d.bo===3?3:1; ui.series=null; startFight(); return null; }
  if(a==='toflip'){ if(player!==0||!ui.names[1]&&!(ui.online.conn&&ui.online.conn.open)) return null; ui.screen='flip'; ui.flip=null; }
  else if(a==='flip'){ if(player!==0||ui.screen!=='flip'||ui.flip) return null; ui.flip=Math.random()<0.5?'testa':'croce'; }
  else if(a==='begin'){ if(player!==0||!ui.flip) return null;
    ui.revealLocal=[false,false]; ui.celebN=null;
    ui.game=newGame({format:ui.format,mode:ui.mode,hide:ui.hide,coins:Number(ui.coins),tier:ui.tier,legends:ui.legends,
      pool:filterPool(POOL,{tier:ui.tier,legends:ui.legends}),firstOpener:ui.flip==='testa'?0:1});
    ui.screen='game'; ui.setChoice={};ui.setEdit={};ui.editOpen=null; }
  else if(a==='draw'){ if(!g||g.auction||g.over) return null; startAuction(g); setDraftFromGame(); }
  else if(a==='raise'){ if(!g||!g.auction) return null; if(g.auction.turn!==player) return 'turn';
    const err=raise(g,player,parseInt(d.amount,10)); if(err) return err; setDraftFromGame(); }
  else if(a==='pass'){ if(!g||!g.auction) return null; if(g.auction.turn!==player) return 'turn'; pass(g,player); }
  else if(a==='reveal'){ if(!g||!g.over||g.hide!=='fine') return null; g.reveal[player]=true; }
  else if(a==='newround'){ if(player!==0) return null; ui.game=null; ui.flip=null; ui.screen='lobby'; ui.setChoice={};ui.setEdit={};ui.editOpen=null; }
  return null;
}

function act(a,d){
  const g=ui.game;
  // Online: le azioni di gioco le esegue chi ha creato la partita; l'altro le invia
  if(ui.online&&ui.screen!=='setup'&&['toflip','flip','begin','draw','raise','pass','reveal'].includes(a)){
    if(isGuest()){ onlineSend({t:'act',a,d:{amount:ui.draft}}); ui.msg=''; render(); return; }
    const err=hostApply(a,{amount:ui.draft},0); ui.msg=err?errText(err):''; broadcast(); render(); return;
  }
  if(a==='fmt'){ui.format=d.v;}
  else if(a==='lang'){ui.lang=d.v; try{localStorage.setItem('incanto-lang',d.v);}catch(e){} ui.msg='';}
  else if(a==='tier'){ui.tier=d.v;}
  else if(a==='legends'){ui.legends=d.v==='1';}

  else if(a==='hide'){ui.hide=d.v;}
  else if(a==='revealLocal'){ui.revealLocal[+d.i]=true;}
  else if(a==='toflip'){const c=Number(ui.coins);
    if(!Number.isInteger(c)||c<TEAM_SIZE||c>999){ui.msg=t('err.coins',TEAM_SIZE);}
    else if(filterPool(POOL,{tier:ui.tier,legends:ui.legends}).length<TEAM_SIZE*2){ui.msg=t('err.pool',TEAM_SIZE);}

    else {ui.msg='';ui.screen='flip';ui.flip=null;}}
  else if(a==='flip'){ui.flip=Math.random()<0.5?'testa':'croce';}
  else if(a==='vscpu'){ui.vsCpu=d.v==='1';}
  else if(a==='begin'){ui.revealLocal=[false,false];ui.celebN=null;ui.cpuSay='';ui.game=newGame({format:ui.format,mode:ui.mode,hide:ui.hide,coins:Number(ui.coins),tier:ui.tier,legends:ui.legends,
    pool:filterPool(POOL,{tier:ui.tier,legends:ui.legends}),firstOpener:ui.flip==='testa'?0:1}); if(ui.vsCpu&&!ui.online&&!ui.setupOnline) ui.game.cpu=1;ui.screen='game';ui.msg='';ui.setChoice={};ui.setEdit={};ui.editOpen=null;}

  else if(a==='raise'){const p=g.auction.turn;const err=raise(g,p,parseInt(ui.draft,10));ui.msg=err?errText(err):'';ui.cpuSay='';
    if(!err){ui.draft=String(Math.min(g.auction.bid+1,Math.max(maxBid(g,g.auction.turn),g.auction.bid+1)));}}

  else if(a==='again'&&ui.online){ if(isHost()){ hostApply('newround',{},0); broadcast(); } }
  else if(a==='again'){ui.screen='setup';ui.game=null;ui.flip=null;ui.msg='';}

    return;}
  else if(a==='noexit'){ui.askExit=false;}
  else if(a==='play'){ui.setupOnline=false;ui.screen='setup';ui.msg=''; const pm=profMe(); if(pm&&!ui.names[0]) ui.names[0]=pm.nick;}
  else if(a==='menu'){ui.setupOnline=false;ui.screen='title';ui.msg='';}
  else if(a==='rules'){ui.modal='rules';}
  else if(a==='legal'){ui.modal='legal';}
  else if(a==='closemodal'){ui.modal=null;}
  else if(a==='exit'&&ui.askExit==='home'){ui.askExit=false;if(ui.online)leaveOnline();ui.setupOnline=false;ui.game=null;ui.flip=null;ui.screen='title';ui.msg='';ui.draft='';}
  else if(a==='exit'&&ui.online){ui.askExit=false;leaveOnline();ui.setupOnline=false;ui.screen='title';ui.msg='';}
  else if(a==='exit'){ui.askExit=false;ui.screen='setup';ui.game=null;ui.flip=null;ui.msg='';ui.draft='';}
  else if(a==='fight'){ ui.series=null; startFight(); return; }
  else if(a==='tower'){ ui.screen='tower'; ui.msg=''; ui.twQuitArm=false; }
  else if(a==='twfight'){ twFight(); return; }
  else if(a==='twnew'){ twNew(); ui.twQuitArm=false; }
  else if(a==='twdraw'){ const o=twLoad(); if(o&&!o.started&&!o.lost&&o.draws.length<3){ o.draws.push(twDraw(twMode(o.mode))); o.pick=o.draws.length-1; twSave(o); } }
  else if(a==='twmode'){ ui.twMode=twMode(d.v).key; ui.twQuitArm=false; const all=profAll(), k=localStorage.getItem(PROF_ME); if(k&&all[k]){ all[k].twMode=ui.twMode; profSaveAll(all); } }
  else if(a==='ptwmode'){ ui.pTwMode=twMode(d.v).key; }
  else if(a==='twpick'){ const o=twLoad(); const i=+d.v; if(o&&!o.started&&!o.lost&&i>=0&&i<o.draws.length){ o.pick=i; twSave(o); } }
  else if(a==='twquit'){ if(!ui.twQuitArm) ui.twQuitArm=true; else { const o=twLoad(); if(o&&!o.lost){ o.lost=true; twSave(o); profUpdate(s=>{ const T=s.torre[twMode(o.mode).key]; T.best=Math.max(T.best||0,o.floor-1); }); } ui.twQuitArm=false; } }
  else if(a==='preset'){ const w=d.v==='torre'?'torre':'online'; const n=ui.pReset&&ui.pReset.w===w?ui.pReset.n+1:1; ui.msgOk=false;
    if(n<=3){ ui.pReset={w,n}; ui.msg=''; } else { ui.pReset=null; const all=profAll(), k=localStorage.getItem(PROF_ME);
      if(k&&all[k]){ const s=cleanStats(all[k].stats); if(w==='online') s.online=emptySec(); else { for(const x of TW_KEYS) s.torre[x]=emptyTower(); all[k].runs={}; delete all[k].run; } all[k].stats=s; profSaveAll(all); ui.msg=t('prof.resetDone'); ui.msgOk=true; } } }
  else if(a==='pavopen'){ ui.pAvOpen=!ui.pAvOpen; }
  else if(a==='pavatar'){ const all=profAll(), k=localStorage.getItem(PROF_ME); if(hasAv()&&Avatar.valid(d.v)&&k&&all[k]){ all[k].avatar=d.v; profSaveAll(all); ui.pAvOpen=false; } }
  else if(a==='ptab'){ ui.pTab=d.v==='torre'?'torre':'online'; }
  else if(a==='profback'){ ui.screen=ui.profBack&&ui.profBack!=='profile'?ui.profBack:'title'; ui.profBack=null; ui.msg=''; }
  else if(a==='profile'){ if(ui.screen!=='profile') ui.profBack=ui.screen; ui.screen='profile'; ui.msg=''; ui.msgOk=false; ui.pReset=null; ui.pCode=''; ui.pDelArm=false; }
  else if(a==='plogin'||a==='pcreate'){ const n=(document.getElementById('pnick')||{}).value, p=(document.getElementById('ppass')||{}).value; ui.pNick=n;
    profLogin(n,p,a==='pcreate').then(err=>{ ui.msg=err||''; render(); }); return; }
  else if(a==='plogout'){ profLogout(); ui.msg=''; ui.pCode=''; }
  else if(a==='pdelete'){ if(!ui.pDelArm){ ui.pDelArm=true; ui.msg=t('prof.delConfirm'); } else { const all=profAll(); delete all[localStorage.getItem(PROF_ME)]; profSaveAll(all); profLogout(); ui.pDelArm=false; ui.msg=''; ui.pCode=''; } }
  else if(a==='pexport'){ ui.pCode=profExport(); ui.msg=''; }
  else if(a==='pcopy'){ copyText(ui.pCode).then(r=>{ const o=document.getElementById('pcp'); if(o) o.textContent=r?t('prof.copied'):t('online.copyFail'); }); return; }
  else if(a==='pimport'){ const err=profImport((document.getElementById('pcode')||{}).value); ui.msg=err||t('prof.imported'); }
  else if(a==='music'){ if(typeof Musica!=='undefined') Musica.toggle(); }
  else if(a==='cryok'){ ui.cryOk=!ui.cryOk; ui.msg=''; }
  else if(a==='playcry'){ playCry(true); return; }
  else if(a==='bo'){ ui.bo=d.v==='3'?3:1; }
  else if(a==='copy'&&ui.online&&+d.i!==ui.online.me){ return; } // online la squadra dell'avversario non si copia
  else if(a==='editset'){ ui.editOpen=ui.editOpen===d.n?null:d.n; }
  else if(a==='editreset'){ delete ui.setEdit[d.n]; }
  else if(a==='copy'){const i=+d.i,tx=exportText(g.teams[i],g.format,ui.setChoice,g.tier,ui.setEdit),out=document.getElementById('cp'+i);
    const fb=()=>{const r=document.createRange();r.selectNodeContents(document.getElementById('ex'+i));const s=getSelection();s.removeAllRanges();s.addRange(r);out.textContent=t('selected');};
    try{navigator.clipboard.writeText(tx).then(()=>{out.textContent=t('copied',showdownFormat(g.format,g.tier));},fb);}catch(e){fb();}
    return;}
  render();
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');
  if(b&&b.classList.contains('modal-bg')&&e.target!==b) return; // clic dentro una finestra: non la chiude
  if(b&&!b.disabled)act(b.dataset.act,b.dataset);});
document.addEventListener('change',e=>{
  const n=e.target.dataset&&e.target.dataset.setfor;
  if(n!==undefined){ui.setChoice[n]=+e.target.value;delete ui.setEdit[n];const y=scrollY;render();scrollTo(0,y);const s=document.getElementById('set-'+n);if(s)s.focus();}
  const ds=e.target.dataset||{}, em=ds.editmove, ei=ds.edititem;
  if(em!==undefined||ei!==undefined){ setEditChange(+ds.i,+ds.j,em!==undefined?'move':'item',+ds.k,e.target.value);
    const y=scrollY;render();scrollTo(0,y);
    const sel=em!==undefined?`[data-editmove][data-i="${+ds.i}"][data-j="${+ds.j}"][data-k="${+ds.k}"]`:`[data-edititem][data-i="${+ds.i}"][data-j="${+ds.j}"]`;
    const s=document.querySelector(sel); if(s) s.focus(); }});
document.addEventListener('input',e=>{
  if(e.target.id==='n0'){ui.names[0]=e.target.value; if(ui.setupOnline) ui.myName=e.target.value;}
  if(e.target.id==='myname')ui.myName=e.target.value;
  if(e.target.id==='pnick')ui.pNick=e.target.value;
  if(e.target.id==='joincode')ui.joinCode=e.target.value.toUpperCase();
  if(e.target.id==='n1')ui.names[1]=e.target.value;
  if(e.target.id==='draft')ui.draft=e.target.value;
  if(e.target.id==='coins')ui.coins=e.target.value;});
document.addEventListener('keydown',e=>{
  if(ui.modal&&e.key==='Escape'){e.preventDefault();act('closemodal',{});return;}
  if(ui.askExit&&e.key==='Escape'){e.preventDefault();act('noexit',{});return;}
  if(ui.askUndo&&e.key==='Escape'){e.preventDefault();act('noundo',{});return;}
  if((ui.askExit||ui.modal||ui.askUndo)&&e.key==='Tab'){const b=[...document.querySelectorAll('.modal button, .modal a')],i=b.indexOf(document.activeElement);
    e.preventDefault();b[(i+(e.shiftKey?-1:1)+b.length)%b.length].focus();return;}
  if(e.key==='Enter'&&e.target.id==='draft'){e.preventDefault();act('raise',{});}
  if(e.key==='Enter'&&e.target.id==='ppass'){e.preventDefault();act('plogin',{});}
  if(e.key==='Enter'&&e.target.id==='joincode'){e.preventDefault();act('onlinejoin',{});}});

twPurgeOld();
render();
// All'apertura, se c'è internet, controlla su Showdown qual è il regolamento VGC di Champions attuale
// (legge il testo dei formati, senza eseguire niente). Senza internet resta il valore salvato.
(async()=>{
  try{
    const ctl=new AbortController(); setTimeout(()=>ctl.abort(),8000);
    const r=await fetch('https://raw.githubusercontent.com/smogon/pokemon-showdown/master/config/formats.ts',{signal:ctl.signal,cache:'no-store'});
    if(!r.ok) return;
    const nuovo=trovaVgcChampions(await r.text());
    if(nuovo&&nuovo!==CHAMP_VGC){CHAMP_VGC=nuovo; if(!ui.askExit) render();}
  }catch(e){}
})();
</script>
